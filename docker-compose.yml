services:
  news2tg:
    image: cheedonghu/news2tg:latest
    container_name: news2tg
    volumes:
      # 使用相对路径挂载本地目录（推荐）
      - ./config:/config
    environment:
      - RUST_CONFIG_PATH=/config/config.toml
    #      - RUST_LOG=info
    # 日志走 stdout/stderr，交给 Docker 的 json-file 驱动轮转，避免无限增长。
    # 用 `docker logs news2tg` 查看；单文件最大 10MB，最多保留 3 个。
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped