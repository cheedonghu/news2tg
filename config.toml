[telegram]
api_token = "token"
chat_id = "id"
# 允许给 bot 发 /summary <网址> 指令的 user id 列表（非白名单会被忽略）。
# 不知道自己的 id？先随便填、跑起来给 bot 发条消息，从日志的 from 字段抄真实 id。
admin_ids = ["123456789"]

[features]
# 新帖推送开关
v2ex_fetch_latest = false
# 新帖推送关键字过滤（满足才会推送）
v2ex_fetch_latest_keyword = ["键盘", "大模型"]
# 新帖推送节点过滤。和上面的关键字是与的关系
v2ex_fetch_latest_node_name = ["movie", "share"]
# 热帖推送开关
v2ex_fetch_hot = false
# hacker news top贴推送开关
hn_fetch_top = true
hn_fetch_latest=false
# 仅解析前5个的hacker news top帖子
hn_fetch_num = 1
# hacker news目标帖子距今时间（hacker news的top算法可能导致大量新帖冒出） 单位:H
hn_fetch_time_gap = 1

# —— 每日天气推送 ——
# 总开关
weather_enabled = false
# 推送时间 HH:MM（空或非法回落 07:00）
weather_push_time = "07:00"
# 城市编码列表（101010100=北京 101280101=广州；编码可在 weather.com.cn 城市页 URL 里找）
weather_cities = ["101010100"]
# 每日天气私聊收件人，"用户id" 或 "用户id:显示名"；与 admin_ids 无关
# 仅私聊发送，不发频道；空列表不推送。用户需先与机器人开始对话。
weather_mention = ["123456789:管理员"]

[qweather]
# 和风控制台提供的 API Host，不带 https://
api_host = ""
developer_id = ""
project_id = ""
key_id = ""
# 容器中将私钥与配置一起挂载；本地开发填写本机路径（Windows 可用单引号）。
private_key_path = "/config/ed25519-private.pem"

[deepseek]
api_token="key"
# 即使关闭 HN / 天气等 AI 功能，model / agent_model 也必须填写——
# main.go 里两个 DeepSeek 客户端是无条件构造的，不看 [features] 开关。
# 摘要 / 穿衣建议用的模型（对应 ai.DeepSeek 的 Summarize、Advise）。
# 换模型改这里重启即可，代码里没有默认值——留空会导致启动失败。
model = "deepseek-v4-flash"
# agent（/summary 指令）用的模型，必须支持 function calling（工具调用），
# 否则 agent 无法在 python / jina 两个正文提取器之间做选择。同样留空即启动失败。
agent_model = "deepseek-chat"

# jina reader(r.jina.ai) 的 key，agent 回退提取渠道用；留空则走免认证公开端点
[jina]
api_token="key"

# 推送记录数据库（SQLite 文件）。容器里对应 docker-compose 挂载的 ./data 卷。
# 本地开发可指到 ./target/dev.db（target/ 已在 .gitignore 里）。
# 留空会导致启动失败——代码里没有默认值。
[storage]
db_path = "/data/news2tg.db"

# /music 指令的 WebDAV 上传目标与凭据（alist 挂载的网盘，通过 WebDAV 统一接管上传）。
#
# 这一段是**可选**的，但"可选"针对的是整段，不是逐字段：
#   - 整段保持全空（含下面的 sources 也不写）→ /music 不注册到命令清单、
#     收到也只回一句未配置，不影响程序启动。这是不想用 /music 的部署者
#     该停留的状态。
#   - 只要碰了其中任何一项——哪怕只是取消注释 sources 那一行——就视为
#     "要启用"，必须把凭据和至少一个上传目标配全，否则直接启动失败
#     （半配置一定是打字漏了，参见下面 sources 的说明）。
#
# ⚠️ 真实凭据只写在 myconfig.toml（已 gitignore），不要填进这个模板文件：
# 本文件是被 git 跟踪的，仓库又是公开的。
[music]
webdav_user   = ""
webdav_pass   = ""
webdav_name_1 = ""
webdav_url_1  = ""
# 第二个目标可留空：至少配一个完整目标（name + url）即可。
# 但不要只填一半 —— 有 name 没 url 会直接启动失败。
webdav_name_2 = ""
webdav_url_2  = ""
# 启用的音源，**顺序即优先级**（模型按这个顺序依次尝试，前一个没结果再换下一个）。
# 不在列表里 = 关闭。不写这一行（保持注释掉）= 全部启用，顺序同下面列出的一致。
#   musicso —— 中文站，聚合 QQ 音乐与网易云，歌名歌手是中文原名，中文歌首选
#   mp3pm   —— 俄语站，中文歌按拼音收录，作为兜底
# 不要写成空数组 sources = []：那会关掉所有音源，启动时会直接报错。
# ⚠️ 取消注释这一行本身就等于"碰了 [music] 段"：这时必须把上面六个
# webdav 字段配好（至少一个完整目标），否则启动失败——不能只打开这一行
# 就指望 /music 能跑。不想用 /music 就让它保持注释掉的状态。
# sources = ["musicso", "mp3pm"]

# 全局 HTTP 代理。留空 = 全部直连（默认，与不写这一段等价）。
# 非空时对所有出站请求生效：Telegram、DeepSeek、V2EX、HN、音源、WebDAV 一视同仁。
# 按主机分流请在代理程序（clash / v2ray 等）的规则里做，这里不提供 no_proxy
# ——但回环地址（127.0.0.1 / localhost）例外：本程序会自动让这类请求直连，
# 无需在代理规则里另作处理。这条例外覆盖 HN 摘要用的 Python sidecar
# （http://127.0.0.1:50051）和常见部署里跑在本机的 WebDAV（如 alist）。
[network]
proxy = ""
