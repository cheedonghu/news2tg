[telegram]
api_token = "token"
chat_id = "id"
# 允许给 bot 发 /summary <网址> 指令的 user id 列表（非白名单会被忽略）。
# 不知道自己的 id？先随便填、跑起来给 bot 发条消息，从日志的 from 字段抄真实 id。
admin_ids = ["123456789"]

[features]
# 新帖推送开关
v2ex_fetch_latest = false
# 新帖推送关键字过滤（满足才会推送）
v2ex_fetch_latest_keyword = ["键盘", "大模型"]
# 新帖推送节点过滤。和上面的关键字是与的关系
v2ex_fetch_latest_node_name = ["movie", "share"]
# 热帖推送开关
v2ex_fetch_hot = false
# hacker news top贴推送开关
hn_fetch_top = true
hn_fetch_latest=false
# 仅解析前5个的hacker news top帖子
hn_fetch_num = 1
# hacker news目标帖子距今时间（hacker news的top算法可能导致大量新帖冒出） 单位:H
hn_fetch_time_gap = 1

# —— 每日天气推送 ——
# 总开关
weather_enabled = false
# 推送时间 HH:MM（空或非法回落 07:00）
weather_push_time = "07:00"
# 城市编码列表（101010100=北京 101280101=广州；编码可在 weather.com.cn 城市页 URL 里找）
weather_cities = ["101010100"]
# 每日天气要 @ 的人，"id" 或 "id:显示名"；与 admin_ids 无关
weather_mention = ["123456789:管理员"]

[deepseek]
api_token="key"
# 即使关闭 HN / 天气等 AI 功能，model / agent_model 也必须填写——
# main.go 里两个 DeepSeek 客户端是无条件构造的，不看 [features] 开关。
# 摘要 / 穿衣建议用的模型（对应 ai.DeepSeek 的 Summarize、Advise）。
# 换模型改这里重启即可，代码里没有默认值——留空会导致启动失败。
model = "deepseek-v4-flash"
# agent（/summary 指令）用的模型，必须支持 function calling（工具调用），
# 否则 agent 无法在 python / jina 两个正文提取器之间做选择。同样留空即启动失败。
agent_model = "deepseek-chat"

# jina reader(r.jina.ai) 的 key，agent 回退提取渠道用；留空则走免认证公开端点
[jina]
api_token="key"

# 推送记录数据库（SQLite 文件）。容器里对应 docker-compose 挂载的 ./data 卷。
# 本地开发可指到 ./target/dev.db（target/ 已在 .gitignore 里）。
# 留空会导致启动失败——代码里没有默认值。
[storage]
db_path = "/data/news2tg.db"

# /music 指令的 WebDAV 上传目标与凭据（alist 挂载的网盘，通过 WebDAV 统一接管上传）。
#
# 这一段是**可选**的：六项全空 → /music 不注册到命令清单、收到也只回一句未配置，
# 不影响程序启动。但**填一半会直接启动失败**——半配置一定是打字漏了。
#
# ⚠️ 真实凭据只写在 myconfig.toml（已 gitignore），不要填进这个模板文件：
# 本文件是被 git 跟踪的，仓库又是公开的。
[music]
webdav_user   = ""
webdav_pass   = ""
webdav_name_1 = ""
webdav_url_1  = ""
webdav_name_2 = ""
webdav_url_2  = ""
